<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>What's in my fridge?</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="App.css">
</head>
<body ng-controller="MainController">
    <div class="container">
        <h1>{{title}}</h1>
        
        <form class="mt-3 mb-4" ng-submit="searchRecipes()">
            <div class="form-group">
                <label for="ingredients" class="fancy">Enter (at least 3) ingredients you have in your fridge!! (comma separated):</label>
                <input type="text" class="form-control" id="ingredients" ng-model="ingredientInput">
            </div>
            <button type="submit" class="btn btn-outline-success">Search</button>
        </form>

        <div class="row" ng-show="showRecipes">
            <div class="col-md-6" ng-repeat="recipe in recipes">
                <div class="card mb-3">
                    <div class="card-body">
                        <h3 class="fancy">{{ recipe.name }}</h3>
                        <p class="card-text">Ingredients: <span class="ingredient">{{ recipe.ingredients.join(', ') }}</span></p>
                        <p class="card-text">Description: {{ recipe.description }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="App.js"></script>
</body>
</html>
